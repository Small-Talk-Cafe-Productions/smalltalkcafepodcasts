name: Deploy to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches: [ 001-homepage-v1 ]
  # Rebuild on Tuesday, Thursday and Saturday at 02:00 UTC to pull in new RSS episodes
  schedule:
    - cron: '0 2 * * 2'
    - cron: '0 2 * * 4'
    - cron: '0 2 * * 6'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# Opt into Node.js 24 for all actions (avoids Node 20 deprecation warnings;
# GitHub will force this default on June 2nd, 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build site
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4