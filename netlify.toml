[build]
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirect disabled Shopify store to the /shop page on the main site
[[redirects]]
  from   = "https://smalltalkcafe.shop/*"
  to     = "https://smalltalkcafe.de/shop/"
  status = 301
  force  = true

# Default: HTML files should be revalidated frequently
[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Immutable static assets with hashed filenames
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/optimized/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/dist/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# API or dynamic endpoints - short caching
[[headers]]
for = "/api/*"
  [headers.values]
  Cache-Control = "public, max-age=60, must-revalidate"

# Robots and other small static files
[[headers]]
for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=86400"
